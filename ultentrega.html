<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ultima Entrega</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #fff;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        button {
            background-color: #ff4d4d;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #e60000;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 20px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background-color: #bb52c4;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            background-color: #58184c;
        }
    </style>
</head>
<body>
    <h1>Lista de Pessoas</h1>
    <ul id="person-list"></ul>
    
    <h2>Adicionar Pessoa</h2>
    <form id="person-form">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        
        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="dataNascimento" name="dataNascimento" required>
        
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required>
        
        <button type="submit">Salvar</button>
    </form>

    <script>
        async function fetchPeople() {
            try {
                const response = await fetch('https://personal-tp6a9zfc.outsystemscloud.com/Pessoas/rest/Pessoas/Pessoas');
                
                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.status);
                }

                const pessoas = await response.json();
                const pessoasList = document.getElementById('person-list');
                pessoasList.innerHTML = '';

                pessoas.forEach(person => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `ID: ${person.Id}, Nome: ${person.Nome}, Data de Nascimento: ${person.DataNascimento}, CPF: ${person.CPF} 
                                          <button onclick="deletePessoa(${person.Id})">Deletar</button>`;
                    pessoasList.appendChild(listItem);
                });
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function deletePessoa(id) {
            const url = `https://personal-tp6a9zfc.outsystemscloud.com/Pessoas/rest/Pessoas/DeletePessoaById?PessoaId=${id}`;
            try {
                const response = await fetch(url, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.status);
                }

                console.log('Pessoa deletada com sucesso');
                fetchPeople();
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function createOrUpdatePessoa(nome, dataNascimento, cpf) {
            const url = 'https://personal-tp6a9zfc.outsystemscloud.com/Pessoas/rest/Pessoas/CreateOrUpdatePessoa';
            const body = {
                "Nome": nome,
                "DataNascimento": dataNascimento,
                "CPF": cpf
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.status);
                }

                const data = await response.json();
                console.log('Resposta da API:', data);
                fetchPeople();
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        document.getElementById('person-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const dataNascimento = document.getElementById('dataNascimento').value;
            const cpf = document.getElementById('cpf').value;

            createOrUpdatePessoa(nome, dataNascimento, cpf);
        });

        console.log("Inicializando carregamento");
        fetchPeople();
        console.log("Fim carregamento");
    </script>
</body>
</html>
